[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidraw"
version = "1.2.1"
description = "Universal diagram rendering platform — render any diagram language to SVG or PNG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PiDraw Contributors" },
]
keywords = [
    "diagram",
    "svg",
    "mermaid",
    "graphviz",
    "plantuml",
    "d2",
    "diagram-as-code",
    "renderer",
    "visualization",
    "documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "vl-convert-python",
]

[project.urls]
homepage = "https://github.com/devasishpal/PiDraw"
repository = "https://github.com/devasishpal/PiDraw"
documentation = "https://github.com/devasishpal/PiDraw"
changelog = "https://github.com/devasishpal/PiDraw/releases"
issues = "https://github.com/devasishpal/PiDraw/issues"

[project.scripts]
pidraw = "pidraw.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.3",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
png = [
    "cairosvg>=2.7",
]
png-playwright = [
    "playwright>=1.40",
]
docx = [
    "python-docx>=1.0",
]
all = [
    "pidraw[dev,docs,png]",
]
all-png = [
    "pidraw[dev,docs,png,png-playwright]",
]
all-docx = [
    "pidraw[dev,docs,png,png-playwright,docx]",
]

[tool.setuptools.packages.find]
include = ["pidraw*"]

[tool.setuptools.package-data]
pidraw = ["**/*.js"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"pidraw/__init__.py" = ["E402"]
"pidraw/backend/png.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = false
no_implicit_reexport = true
disallow_any_unimported = false
disallow_subclassing_any = false
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pidraw.core.converters.d2",
    "pidraw.core.converters.ascii",
    "pidraw.core.converters.mermaid",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pidraw.renderer_class",
    "pidraw.recovery",
    "pidraw.large",
    "pidraw.benchmark",
    "pidraw.async_api",
    "pidraw.cli.commands",
    "pidraw.backend.png",
]
ignore_errors = true
