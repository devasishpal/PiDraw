[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidraw"
version = "0.1.0"
description = "Universal diagram rendering platform — render any diagram language to SVG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PiDraw Contributors" },
]
keywords = [
    "diagram",
    "svg",
    "mermaid",
    "graphviz",
    "plantuml",
    "d2",
    "diagram-as-code",
    "renderer",
    "visualization",
    "documentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "vl-convert-python",
]

[project.urls]
homepage = "https://github.com/devasishpal/PiDraw"
repository = "https://github.com/devasishpal/PiDraw"
documentation = "https://github.com/devasishpal/PiDraw"
changelog = "https://github.com/devasishpal/PiDraw/releases"
issues = "https://github.com/devasishpal/PiDraw/issues"

[project.scripts]
pidraw = "pidraw.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.3",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
all = [
    "pidraw[dev,docs]",
]

[tool.setuptools.packages.find]
include = ["pidraw*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = ["D100", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_any_unimported = true
disallow_subclassing_any = true
ignore_missing_imports = false
no_implicit_reexport = true
